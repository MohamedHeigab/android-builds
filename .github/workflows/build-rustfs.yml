name: Build RustFS for Android ARM64

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * *' # Automatically run daily

jobs:
  build:
    name: Compile RustFS for Android (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get latest commit hash
        id: get-commit
        run: |
          hash=$(git ls-remote https://github.com/rustfs/rustfs.git HEAD | awk '{print $1}')
          echo "hash=$hash" >> $GITHUB_OUTPUT

      - name: Restore build cache status
        id: cache
        uses: actions/cache@v4
        with:
          path: last-built-commit.txt
          key: cache-${{ github.workflow }}-${{ hashFiles('.github/workflows/build-rustfs.yml') }}-${{ steps.get-commit.outputs.hash }}

      - name: Create commit file on miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.get-commit.outputs.hash }}" > last-built-commit.txt

      - name: Checkout RustFS repository
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rustfs/rustfs
          
      - name: Set up Rust
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure Android NDK toolchain
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: |
          # Use the pre-installed NDK on GitHub-hosted Ubuntu runners
          NDK_TOOLCHAIN_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          # Inform Cargo about the Android linker and C compiler wrapper
          # API level 24 is widely compatible for modern Android devices
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_TOOLCHAIN_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$NDK_TOOLCHAIN_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$NDK_TOOLCHAIN_BIN/aarch64-linux-android24-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_TOOLCHAIN_BIN/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_linux_android=$NDK_TOOLCHAIN_BIN/llvm-ranlib" >> $GITHUB_ENV
          
          # Add the NDK bin directory to the PATH so build scripts can find other tools
          echo "$NDK_TOOLCHAIN_BIN" >> $GITHUB_PATH

      - name: Install protobuf-compiler
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Patch Cargo.toml for Android CLI compatibility
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: |
          # Replace 'rustls' with 'native-tls-vendored' for reqwest to avoid 'rustls-platform-verifier'
          # which panics on Android when run without a JNI context (e.g. in Termux).
          find . -name Cargo.toml -exec sed -i '/reqwest =/ s/"rustls"/"native-tls-vendored"/g' {} +
          find . -name Cargo.toml -exec sed -i 's/"reqwest-rustls"/"reqwest-client"/g' {} +
          
          # Replace 'rustls' with 'rustls-native-certs' for lapin to fix rustls-platform-verifier E0599 error on Android
          find . -name Cargo.toml -exec sed -i '/lapin =/ s/"rustls"/"rustls-native-certs"/g' {} +
          find . -name Cargo.toml -exec sed -i '/lapin =/ s/"rustls-native-certs--aws_lc_rs"/"rustls--aws_lc_rs"/g' {} +

      - name: Download console static assets
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p rustfs/static
          curl --fail -L "https://dl.rustfs.com/artifacts/console/rustfs-console-latest.zip" -o console.zip --retry 3 --retry-delay 5 --max-time 300
          unzip -o console.zip -d rustfs/static
          rm console.zip

      - name: Build RustFS
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo build --release --target aarch64-linux-android
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
          
      - name: Strip debug symbols
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: |
          # Strip debug symbols to drastically reduce the binary size
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip target/aarch64-linux-android/release/rustfs
          tar -czf rustfs-android-arm64.tar.gz -C target/aarch64-linux-android/release rustfs
          
      - name: Upload binary artifact
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rustfs-android-arm64
          path: rustfs-android-arm64.tar.gz
          if-no-files-found: error

      - name: Release binary
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Builds
          body: "This release contains the latest automated builds of all Android tools."
          files: rustfs-android-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
