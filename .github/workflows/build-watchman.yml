name: Build Watchman for aarch64 glibc (grunner/termux)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * *' # Automatically run daily

jobs:
  build:
    name: Compile Watchman (aarch64-linux-gnu)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Get latest commit hash
        id: get-commit
        run: |
          hash=$(git ls-remote https://github.com/facebook/watchman.git HEAD | awk '{print $1}')
          echo "hash=$hash" >> $GITHUB_OUTPUT

      - name: Restore build cache status
        id: cache
        uses: actions/cache@v4
        with:
          path: last-built-commit.txt
          key: cache-${{ github.workflow }}-${{ hashFiles('.github/workflows/build-watchman.yml') }}-${{ steps.get-commit.outputs.hash }}

      - name: Create commit file on miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.get-commit.outputs.hash }}" > last-built-commit.txt

      - name: Checkout repository
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Cross-compile Watchman in Docker
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace ubuntu:22.04 /bin/bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            
            apt-get update
            apt-get install -y curl git build-essential cmake python3 python3-dev python3-pip pkg-config sudo wget libssl-dev
            
            # Install Rust for aarch64
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            export PATH=\"\$HOME/.cargo/bin:\$PATH\"
            
            cd /workspace
            
            # Clone Watchman
            git clone https://github.com/facebook/watchman.git watchman-src
            cd watchman-src
            
            # Patch hardcoded paths that may fail on Termux / Android
            find . -type f -name '*.cpp' -o -name '*.h' -o -name '*.rs' | xargs sed -i 's|/var/run/watchman|/data/data/com.termux/files/usr/var/run/watchman|g'
            find . -type f -name '*.cpp' -o -name '*.h' -o -name '*.rs' | xargs sed -i 's|/usr/local/var/run/watchman|/data/data/com.termux/files/usr/var/run/watchman|g'
            find . -type f -name '*.cpp' -o -name '*.h' -o -name '*.rs' | xargs sed -i 's|\"/tmp|\"/data/data/com.termux/files/usr/tmp|g'
            
            # Install all Facebook dependencies (folly, fizz, edencommon) via Watchman's official script
            python3 build/fbcode_builder/getdeps.py install-system-deps --recursive watchman
            
            # Force getdeps.py to build these statically from source by removing the system dynamic libraries
            apt-get remove -y libglog-dev libgflags-dev libsnappy-dev libevent-dev libzstd-dev liblz4-dev libdouble-conversion-dev libfmt-dev libsodium-dev libunwind-dev || true
            
            # Build Watchman and all its dependencies statically
            python3 build/fbcode_builder/getdeps.py build --no-tests --extra-cmake-defines '{\"BUILD_SHARED_LIBS\": \"OFF\", \"WATCHMAN_STATE_DIR\": \"/data/data/com.termux/files/usr/var/run/watchman\"}' watchman
            
            # The binary is placed deep in a tmp directory by getdeps, copy it out
            mkdir -p ../artifacts
            find /tmp -path "*/installed/watchman/bin/watchman" -type f -executable -exec cp {} ../artifacts/watchman-aarch64-glibc \;
            
            # Strip debug symbols to reduce size
            strip ../artifacts/watchman-aarch64-glibc
          "

      - name: Upload binary artifact
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: watchman-aarch64-glibc-termux
          path: artifacts/watchman-aarch64-glibc
          if-no-files-found: error

      - name: Release binary
        if: github.event_name != 'schedule' || steps.cache.outputs.cache-hit != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Builds
          body: "This release contains the latest automated builds of all Android tools."
          files: artifacts/watchman-aarch64-glibc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
